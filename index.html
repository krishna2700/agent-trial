<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Button</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
        }

        #agentButton {
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border: 2px solid #333;
            border-radius: 8px;
            cursor: pointer;
            background-color: #ffffff;
            transition: background-color 0.3s ease;
        }

        #agentButton:hover {
            opacity: 0.9;
        }

        #agentButton.yellow {
            background-color: #FFD700;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        #agentInput {
            padding: 10px 14px;
            font-size: 16px;
            border: 2px solid #333;
            border-radius: 6px;
            width: 240px;
        }
    </style>
</head>
<body>
    <div class="container">
        <input id="agentInput" type="text" placeholder="Enter text" />
        <button id="agentButton">Click Me!</button>
    </div>

    <script>
        const button = document.getElementById('agentButton');

        button.onclick = function() {
            this.classList.add('yellow');
        };
    </script>
</body>
</html>
