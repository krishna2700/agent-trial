<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Button</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
        }

        #agentButton {
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border: 2px solid #333;
            border-radius: 8px;
            cursor: pointer;
            background-color: #ffffff;
            transition: background-color 0.3s ease;
        }

        #agentButton:hover {
            opacity: 0.9;
        }

        #agentButton.yellow {
            background-color: #FFD700;
        }

        #apiButton {
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border: 2px solid #333;
            border-radius: 8px;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            transition: all 0.3s ease;
            margin-left: 20px;
        }

        #apiButton:hover {
            background-color: #45a049;
        }

        #apiButton:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }

        .button-container {
            display: flex;
            gap: 20px;
        }

        #apiResponse {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            background-color: white;
            border: 1px solid #ddd;
            max-width: 600px;
            word-wrap: break-word;
        }
    </style>
</head>
<body>
    <div class="button-container">
        <button id="agentButton">Click Me!</button>
        <button id="apiButton">Call API</button>
    </div>
    <div id="apiResponse" style="display: none;"></div>

    <script>
        const button = document.getElementById('agentButton');

        button.onclick = function() {
            this.classList.add('yellow');
        };

        const apiButton = document.getElementById('apiButton');
        const apiResponse = document.getElementById('apiResponse');

        apiButton.onclick = async function() {
            // Disable button during API call
            apiButton.disabled = true;
            apiButton.textContent = 'Loading...';
            apiResponse.style.display = 'block';
            apiResponse.textContent = 'Fetching data...';

            try {
                // Make API call to a public test API
                const response = await fetch('https://jsonplaceholder.typicode.com/posts/1');
                const data = await response.json();

                // Display the response
                apiResponse.textContent = JSON.stringify(data, null, 2);
                apiResponse.style.color = '#4CAF50';
            } catch (error) {
                apiResponse.textContent = 'Error: ' + error.message;
                apiResponse.style.color = '#f44336';
            } finally {
                // Re-enable button
                apiButton.disabled = false;
                apiButton.textContent = 'Call API';
            }
        };
    </script>
</body>
</html>
