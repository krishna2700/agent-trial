<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SprintBoard — Acme Corp</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: #2e3248;
      --accent: #6c63ff;
      --accent-soft: rgba(108,99,255,0.15);
      --green: #22c55e;
      --green-soft: rgba(34,197,94,0.12);
      --yellow: #f59e0b;
      --yellow-soft: rgba(245,158,11,0.12);
      --red: #ef4444;
      --red-soft: rgba(239,68,68,0.12);
      --blue: #3b82f6;
      --blue-soft: rgba(59,130,246,0.12);
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --radius: 12px;
      --shadow: 0 4px 24px rgba(0,0,0,0.4);
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── TOP NAV ── */
    nav {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 60px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .nav-left { display: flex; align-items: center; gap: 14px; }
    .logo {
      display: flex; align-items: center; gap: 8px;
      font-weight: 800; font-size: 18px; letter-spacing: -0.5px; color: var(--text);
    }
    .logo-icon {
      width: 32px; height: 32px; background: var(--accent);
      border-radius: 8px; display: flex; align-items: center; justify-content: center;
      font-size: 16px;
    }
    .sprint-badge {
      background: var(--accent-soft); color: var(--accent);
      border: 1px solid rgba(108,99,255,0.3);
      padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600;
    }
    .nav-right { display: flex; align-items: center; gap: 12px; }
    .avatar {
      width: 32px; height: 32px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 700; color: #fff;
    }
    .btn-new {
      background: var(--accent); color: #fff; border: none;
      padding: 7px 16px; border-radius: 8px; font-size: 13px; font-weight: 600;
      cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 6px;
    }
    .btn-new:hover { background: #7c75ff; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(108,99,255,0.4); }

    /* ── SPRINT HEADER ── */
    .sprint-header {
      padding: 28px 32px 0;
      display: flex; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; gap: 16px;
    }
    .sprint-title { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
    .sprint-dates { color: var(--text-muted); font-size: 13px; margin-top: 4px; }
    .sprint-stats {
      display: flex; gap: 16px; flex-wrap: wrap;
    }
    .stat-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 14px 20px; text-align: center; min-width: 90px;
    }
    .stat-num { font-size: 24px; font-weight: 800; }
    .stat-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; }

    /* ── PROGRESS BAR ── */
    .progress-section { padding: 20px 32px 0; }
    .progress-header { display: flex; justify-content: space-between; margin-bottom: 8px; }
    .progress-label { font-size: 13px; font-weight: 600; }
    .progress-pct { font-size: 13px; color: var(--accent); font-weight: 700; }
    .progress-bar {
      height: 8px; background: var(--surface2); border-radius: 99px; overflow: hidden;
    }
    .progress-fill {
      height: 100%; background: linear-gradient(90deg, var(--accent), #a78bfa);
      border-radius: 99px; transition: width 0.8s cubic-bezier(0.4,0,0.2,1);
    }

    /* ── FILTERS ── */
    .filters {
      padding: 20px 32px 0;
      display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
    }
    .filter-btn {
      padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 600;
      border: 1px solid var(--border); background: transparent; color: var(--text-muted);
      cursor: pointer; transition: all 0.18s;
    }
    .filter-btn:hover { border-color: var(--accent); color: var(--accent); }
    .filter-btn.active { background: var(--accent-soft); border-color: rgba(108,99,255,0.4); color: var(--accent); }
    .search-wrap { margin-left: auto; position: relative; }
    .search-wrap input {
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text); padding: 7px 14px 7px 36px; border-radius: 8px;
      font-size: 13px; font-family: inherit; outline: none; width: 220px; transition: border 0.2s;
    }
    .search-wrap input:focus { border-color: var(--accent); }
    .search-icon {
      position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
      color: var(--text-muted); font-size: 14px; pointer-events: none;
    }

    /* ── BOARD ── */
    .board {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      padding: 20px 32px 40px;
    }
    @media (max-width: 1100px) { .board { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 640px) { .board { grid-template-columns: 1fr; } }

    .column { display: flex; flex-direction: column; gap: 0; }
    .col-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 4px 12px;
    }
    .col-title-wrap { display: flex; align-items: center; gap: 8px; }
    .col-dot { width: 8px; height: 8px; border-radius: 50%; }
    .col-title { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; }
    .col-count {
      background: var(--surface2); color: var(--text-muted);
      padding: 2px 7px; border-radius: 20px; font-size: 11px; font-weight: 600;
    }

    .cards-list { display: flex; flex-direction: column; gap: 10px; }

    /* ── TASK CARD ── */
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 16px;
      cursor: pointer; transition: all 0.2s; position: relative; overflow: hidden;
    }
    .card::before {
      content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    }
    .card.priority-critical::before { background: var(--red); }
    .card.priority-high::before { background: var(--yellow); }
    .card.priority-medium::before { background: var(--accent); }
    .card.priority-low::before { background: var(--green); }
    .card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: var(--shadow); }

    .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
    .card-id { font-size: 10px; color: var(--text-muted); font-weight: 600; letter-spacing: 0.5px; }
    .priority-badge {
      font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 20px;
      text-transform: uppercase; letter-spacing: 0.3px;
    }
    .priority-badge.critical { background: var(--red-soft); color: var(--red); }
    .priority-badge.high { background: var(--yellow-soft); color: var(--yellow); }
    .priority-badge.medium { background: var(--accent-soft); color: var(--accent); }
    .priority-badge.low { background: var(--green-soft); color: var(--green); }

    .card-title { font-size: 14px; font-weight: 600; line-height: 1.4; margin-bottom: 10px; }
    .card-desc { font-size: 12px; color: var(--text-muted); line-height: 1.5; margin-bottom: 12px; }

    .card-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 12px; }
    .tag {
      font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 20px;
      background: var(--surface2); color: var(--text-muted); border: 1px solid var(--border);
    }

    .card-footer { display: flex; align-items: center; justify-content: space-between; }
    .card-meta { display: flex; align-items: center; gap: 8px; }
    .story-pts {
      display: flex; align-items: center; gap: 4px;
      font-size: 11px; color: var(--text-muted); font-weight: 600;
    }
    .due-date {
      font-size: 11px; color: var(--text-muted);
    }
    .due-date.overdue { color: var(--red); }
    .card-assignees { display: flex; gap: -4px; }
    .card-assignees .avatar { width: 24px; height: 24px; font-size: 9px; margin-left: -4px; border: 2px solid var(--surface); }

    /* ── MODAL ── */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.65); backdrop-filter: blur(4px);
      z-index: 200; display: none; align-items: center; justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; width: 100%; max-width: 560px; max-height: 90vh;
      overflow-y: auto; box-shadow: 0 24px 64px rgba(0,0,0,0.6);
      animation: slideUp 0.22s ease;
    }
    @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .modal-header {
      padding: 24px 24px 16px;
      display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
      border-bottom: 1px solid var(--border);
    }
    .modal-title { font-size: 18px; font-weight: 700; line-height: 1.3; }
    .modal-close {
      background: var(--surface2); border: none; color: var(--text-muted);
      width: 30px; height: 30px; border-radius: 8px; font-size: 16px;
      cursor: pointer; flex-shrink: 0; transition: all 0.15s;
    }
    .modal-close:hover { background: var(--border); color: var(--text); }
    .modal-body { padding: 20px 24px 24px; display: flex; flex-direction: column; gap: 16px; }
    .meta-row { display: flex; gap: 24px; flex-wrap: wrap; }
    .meta-item { display: flex; flex-direction: column; gap: 4px; }
    .meta-key { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }
    .meta-val { font-size: 13px; font-weight: 600; }
    .modal-desc { font-size: 14px; color: var(--text-muted); line-height: 1.6; }
    .section-label { font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
    .checklist { display: flex; flex-direction: column; gap: 6px; }
    .check-item {
      display: flex; align-items: center; gap: 10px;
      font-size: 13px; padding: 8px 10px; border-radius: 8px;
      cursor: pointer; transition: background 0.15s;
    }
    .check-item:hover { background: var(--surface2); }
    .check-item input[type=checkbox] { accent-color: var(--accent); width: 15px; height: 15px; cursor: pointer; }
    .check-item.done span { text-decoration: line-through; color: var(--text-muted); }
    .activity { display: flex; flex-direction: column; gap: 10px; }
    .activity-item { display: flex; gap: 10px; align-items: flex-start; }
    .activity-item .avatar { width: 26px; height: 26px; font-size: 9px; flex-shrink: 0; }
    .activity-text { font-size: 12px; color: var(--text-muted); line-height: 1.5; }
    .activity-text strong { color: var(--text); }
    .activity-time { font-size: 10px; color: var(--text-muted); }

    /* ── ADD TASK MODAL ── */
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-label { font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.4px; }
    .form-input, .form-select, .form-textarea {
      background: var(--surface2); border: 1px solid var(--border);
      color: var(--text); padding: 10px 12px; border-radius: 8px;
      font-size: 13px; font-family: inherit; outline: none; transition: border 0.2s;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--accent); }
    .form-textarea { resize: vertical; min-height: 80px; }
    .form-select option { background: var(--surface2); }
    .form-row { display: flex; gap: 12px; }
    .form-row .form-group { flex: 1; }
    .btn-submit {
      background: var(--accent); color: #fff; border: none;
      padding: 11px 24px; border-radius: 8px; font-size: 14px; font-weight: 600;
      cursor: pointer; transition: all 0.2s; width: 100%;
    }
    .btn-submit:hover { background: #7c75ff; transform: translateY(-1px); box-shadow: 0 4px 14px rgba(108,99,255,0.4); }

    /* ── STATUS CHIPS in modal ── */
    .status-chip {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 600;
    }
    .status-chip.todo { background: rgba(148,163,184,0.12); color: #94a3b8; }
    .status-chip.in-progress { background: var(--blue-soft); color: var(--blue); }
    .status-chip.review { background: var(--yellow-soft); color: var(--yellow); }
    .status-chip.done { background: var(--green-soft); color: var(--green); }

    /* ── EMPTY STATE ── */
    .empty-col {
      background: var(--surface); border: 1px dashed var(--border);
      border-radius: var(--radius); padding: 24px 16px; text-align: center;
      color: var(--text-muted); font-size: 12px;
    }

    /* ── TOAST ── */
    .toast {
      position: fixed; bottom: 24px; right: 24px; z-index: 300;
      background: var(--green); color: #fff; padding: 12px 20px;
      border-radius: 10px; font-size: 13px; font-weight: 600;
      box-shadow: 0 8px 24px rgba(34,197,94,0.35);
      transform: translateY(80px); opacity: 0; transition: all 0.3s;
    }
    .toast.show { transform: translateY(0); opacity: 1; }

    /* scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }
  </style>
</head>
<body>

<!-- NAV -->
<nav>
  <div class="nav-left">
    <div class="logo">
      <div class="logo-icon">📋</div>
      SprintBoard
    </div>
    <div class="sprint-badge">Sprint 12</div>
  </div>
  <div class="nav-right">
    <button class="btn-new" onclick="openAddModal()">+ New Task</button>
    <div class="avatar" style="background:#6c63ff" title="Alex Morgan">AM</div>
    <div class="avatar" style="background:#22c55e" title="Jordan Lee">JL</div>
    <div class="avatar" style="background:#f59e0b" title="Sam Rivera">SR</div>
  </div>
</nav>

<!-- SPRINT HEADER -->
<div class="sprint-header">
  <div>
    <div class="sprint-title">Sprint 12 — Platform Reboot</div>
    <div class="sprint-dates">Apr 28, 2026 → May 11, 2026 &nbsp;·&nbsp; Acme Corp Engineering</div>
  </div>
  <div class="sprint-stats">
    <div class="stat-card">
      <div class="stat-num" id="stat-total">16</div>
      <div class="stat-label">Total</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" style="color:var(--green)" id="stat-done">5</div>
      <div class="stat-label">Done</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" style="color:var(--blue)" id="stat-progress">4</div>
      <div class="stat-label">In Progress</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" style="color:var(--yellow)" id="stat-pts">47</div>
      <div class="stat-label">Story Pts</div>
    </div>
  </div>
</div>

<!-- PROGRESS -->
<div class="progress-section">
  <div class="progress-header">
    <span class="progress-label">Sprint Progress</span>
    <span class="progress-pct" id="progress-pct">31%</span>
  </div>
  <div class="progress-bar">
    <div class="progress-fill" id="progress-fill" style="width:31%"></div>
  </div>
</div>

<!-- FILTERS -->
<div class="filters">
  <button class="filter-btn active" data-filter="all" onclick="applyFilter(this,'all')">All</button>
  <button class="filter-btn" data-filter="critical" onclick="applyFilter(this,'critical')">🔴 Critical</button>
  <button class="filter-btn" data-filter="high" onclick="applyFilter(this,'high')">🟡 High</button>
  <button class="filter-btn" data-filter="medium" onclick="applyFilter(this,'medium')">🟣 Medium</button>
  <button class="filter-btn" data-filter="low" onclick="applyFilter(this,'low')">🟢 Low</button>
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input type="text" placeholder="Search tasks…" id="searchInput" oninput="applySearch()" />
  </div>
</div>

<!-- BOARD -->
<div class="board" id="board">
  <!-- Rendered by JS -->
</div>

<!-- ── TASK DETAIL MODAL ── -->
<div class="modal-overlay" id="detailOverlay" onclick="closeIfOverlay(event,'detailOverlay')">
  <div class="modal" id="detailModal">
    <div class="modal-header">
      <div>
        <div style="font-size:11px;color:var(--text-muted);margin-bottom:6px" id="d-id"></div>
        <div class="modal-title" id="d-title"></div>
      </div>
      <button class="modal-close" onclick="closeModal('detailOverlay')">✕</button>
    </div>
    <div class="modal-body">
      <div class="meta-row" id="d-meta"></div>
      <div>
        <div class="section-label">Description</div>
        <div class="modal-desc" id="d-desc"></div>
      </div>
      <div>
        <div class="section-label">Checklist</div>
        <div class="checklist" id="d-checklist"></div>
      </div>
      <div>
        <div class="section-label">Activity</div>
        <div class="activity" id="d-activity"></div>
      </div>
    </div>
  </div>
</div>

<!-- ── ADD TASK MODAL ── -->
<div class="modal-overlay" id="addOverlay" onclick="closeIfOverlay(event,'addOverlay')">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">New Task</div>
      <button class="modal-close" onclick="closeModal('addOverlay')">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">Title</label>
        <input class="form-input" id="f-title" type="text" placeholder="What needs to be done?" />
      </div>
      <div class="form-group">
        <label class="form-label">Description</label>
        <textarea class="form-textarea" id="f-desc" placeholder="Add more context…"></textarea>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Priority</label>
          <select class="form-select" id="f-priority">
            <option value="critical">Critical</option>
            <option value="high">High</option>
            <option value="medium" selected>Medium</option>
            <option value="low">Low</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Column</label>
          <select class="form-select" id="f-status">
            <option value="todo">To Do</option>
            <option value="in-progress">In Progress</option>
            <option value="review">In Review</option>
            <option value="done">Done</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Story Points</label>
          <input class="form-input" id="f-pts" type="number" min="1" max="21" value="3" />
        </div>
        <div class="form-group">
          <label class="form-label">Assignee</label>
          <select class="form-select" id="f-assignee">
            <option value="AM">Alex Morgan</option>
            <option value="JL">Jordan Lee</option>
            <option value="SR">Sam Rivera</option>
            <option value="KP">Kim Park</option>
            <option value="DC">Dan Chen</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Tags (comma separated)</label>
        <input class="form-input" id="f-tags" type="text" placeholder="e.g. frontend, api, bug" />
      </div>
      <button class="btn-submit" onclick="addTask()">Create Task</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast">Task created!</div>

<script>
/* ─── STATIC DATA ─── */
const ASSIGNEE_COLORS = { AM:'#6c63ff', JL:'#22c55e', SR:'#f59e0b', KP:'#3b82f6', DC:'#ef4444', NA:'#94a3b8' };

let tasks = [
  {
    id:'ACM-101', title:'Redesign user authentication flow', status:'done',
    priority:'critical', pts:8, due:'May 3', assignees:['AM','JL'],
    tags:['frontend','auth','security'],
    desc:'Overhaul the login and registration pages to align with the new design system. Add OAuth support for Google and GitHub. Ensure WCAG 2.1 AA compliance throughout.',
    checklist:[
      {text:'Design mockups approved', done:true},
      {text:'OAuth Google integration', done:true},
      {text:'OAuth GitHub integration', done:true},
      {text:'Accessibility audit pass', done:true},
      {text:'Unit tests written', done:true},
    ],
    activity:[
      {who:'AM',color:'#6c63ff',text:'<strong>Alex Morgan</strong> marked this task as done.',time:'2h ago'},
      {who:'JL',color:'#22c55e',text:'<strong>Jordan Lee</strong> completed OAuth GitHub integration.',time:'5h ago'},
    ]
  },
  {
    id:'ACM-102', title:'API rate-limiting middleware', status:'done',
    priority:'critical', pts:5, due:'May 2', assignees:['DC'],
    tags:['backend','api','security'],
    desc:'Implement token-bucket rate limiting on all public API endpoints. Expose rate-limit headers (X-RateLimit-Limit, X-RateLimit-Remaining, Retry-After) per RFC 6585.',
    checklist:[
      {text:'Token-bucket algorithm implemented', done:true},
      {text:'Redis integration for distributed limits', done:true},
      {text:'Headers added to all responses', done:true},
      {text:'Load test passed (10k RPS)', done:true},
    ],
    activity:[
      {who:'DC',color:'#ef4444',text:'<strong>Dan Chen</strong> completed load testing at 10k RPS.',time:'1d ago'},
    ]
  },
  {
    id:'ACM-103', title:'Dashboard analytics charts', status:'done',
    priority:'high', pts:5, due:'May 4', assignees:['SR','KP'],
    tags:['frontend','analytics'],
    desc:'Build interactive revenue, DAU, and retention charts on the main dashboard using Chart.js. Data must be fetched from /api/v2/metrics with 5-minute cache TTL.',

/* ─── COLUMNS CONFIG ─── */
const COLUMNS = [
  { id:'todo',        label:'To Do',       dot:'#94a3b8' },
  { id:'in-progress', label:'In Progress', dot:'#3b82f6' },
  { id:'review',      label:'In Review',   dot:'#f59e0b' },
  { id:'done',        label:'Done',        dot:'#22c55e' },
];

let activeFilter = 'all';
let searchQuery = '';

/* ─── RENDER ─── */
function render() {
  const q = searchQuery.toLowerCase();
  const board = document.getElementById('board');
  board.innerHTML = '';

  COLUMNS.forEach(col => {
    const filtered = tasks.filter(t => {
      if (t.status !== col.id) return false;
      if (activeFilter !== 'all' && t.priority !== activeFilter) return false;
      if (q && !t.title.toLowerCase().includes(q) && !t.tags.join(' ').includes(q)) return false;
      return true;
    });

    const colEl = document.createElement('div');
    colEl.className = 'column';
    colEl.innerHTML = `
      <div class="col-header">
        <div class="col-title-wrap">
          <div class="col-dot" style="background:${col.dot}"></div>
          <div class="col-title">${col.label}</div>
        </div>
        <div class="col-count">${filtered.length}</div>
      </div>
      <div class="cards-list" id="col-${col.id}">
        ${filtered.length === 0 ? '<div class="empty-col">No tasks here</div>' : ''}
      </div>
    `;
    board.appendChild(colEl);

    const list = colEl.querySelector(`#col-${col.id}`);
    filtered.forEach(t => {
      const card = buildCard(t);
      list.appendChild(card);
    });
  });

  updateStats();
}

function buildCard(t) {
  const el = document.createElement('div');
  el.className = `card priority-${t.priority}`;
  el.onclick = () => openDetail(t.id);

  const assigneeHTML = t.assignees.map(a =>
    `<div class="avatar" style="background:${ASSIGNEE_COLORS[a]||'#666'}" title="${a}">${a}</div>`
  ).join('');

  const tagsHTML = t.tags.map(tag => `<div class="tag">${tag}</div>`).join('');

  const done = t.checklist.filter(c=>c.done).length;
  const total = t.checklist.length;

  el.innerHTML = `
    <div class="card-top">
      <div class="card-id">${t.id}</div>
      <div class="priority-badge ${t.priority}">${t.priority}</div>
    </div>
    <div class="card-title">${t.title}</div>
    <div class="card-tags">${tagsHTML}</div>
    <div class="card-footer">
      <div class="card-meta">
        <div class="story-pts">⚡ ${t.pts}pts</div>
        ${total > 0 ? `<div class="due-date">${done}/${total} tasks</div>` : ''}
      </div>
      <div class="card-assignees">${assigneeHTML}</div>
    </div>
  `;
  return el;
}

/* ─── STATS ─── */
function updateStats() {
  const total = tasks.length;
  const done  = tasks.filter(t=>t.status==='done').length;
  const prog  = tasks.filter(t=>t.status==='in-progress').length;
  const pts   = tasks.reduce((s,t)=>s+t.pts,0);
  const pct   = Math.round((done/total)*100);

  document.getElementById('stat-total').textContent   = total;
  document.getElementById('stat-done').textContent    = done;
  document.getElementById('stat-progress').textContent= prog;
  document.getElementById('stat-pts').textContent     = pts;
  document.getElementById('progress-pct').textContent = pct+'%';
  document.getElementById('progress-fill').style.width = pct+'%';
}

/* ─── FILTER / SEARCH ─── */
function applyFilter(btn, f) {
  activeFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}
function applySearch() {
  searchQuery = document.getElementById('searchInput').value;
  render();
}

/* ─── DETAIL MODAL ─── */
function openDetail(id) {
  const t = tasks.find(x=>x.id===id);
  if (!t) return;

  document.getElementById('d-id').textContent = t.id;
  document.getElementById('d-title').textContent = t.title;
  document.getElementById('d-desc').textContent = t.desc;

  // status label
  const statusLabel = { todo:'To Do', 'in-progress':'In Progress', review:'In Review', done:'Done' }[t.status];
  document.getElementById('d-meta').innerHTML = `
    <div class="meta-item">
      <div class="meta-key">Status</div>
      <div class="meta-val"><span class="status-chip ${t.status}">${statusLabel}</span></div>
    </div>
    <div class="meta-item">
      <div class="meta-key">Priority</div>
      <div class="meta-val"><span class="priority-badge ${t.priority}">${t.priority}</span></div>
    </div>
    <div class="meta-item">
      <div class="meta-key">Story Points</div>
      <div class="meta-val">⚡ ${t.pts}</div>
    </div>
    <div class="meta-item">
      <div class="meta-key">Due</div>
      <div class="meta-val">${t.due}</div>
    </div>
    <div class="meta-item">
      <div class="meta-key">Assignees</div>
      <div class="meta-val" style="display:flex;gap:4px">
        ${t.assignees.map(a=>`<div class="avatar" style="background:${ASSIGNEE_COLORS[a]||'#666'};width:26px;height:26px;font-size:9px">${a}</div>`).join('')}
      </div>
    </div>
  `;

  // checklist
  const cl = document.getElementById('d-checklist');
  cl.innerHTML = t.checklist.map((c,i) => `
    <label class="check-item ${c.done?'done':''}" onclick="toggleCheck('${id}',${i})">
      <input type="checkbox" ${c.done?'checked':''} onclick="event.stopPropagation();toggleCheck('${id}',${i})" />
      <span>${c.text}</span>
    </label>
  `).join('');

  // activity
  const act = document.getElementById('d-activity');
  if (t.activity.length === 0) {
    act.innerHTML = '<div style="color:var(--text-muted);font-size:12px">No activity yet.</div>';
  } else {
    act.innerHTML = t.activity.map(a => `
      <div class="activity-item">
        <div class="avatar" style="background:${a.color}">${a.who}</div>
        <div>
          <div class="activity-text">${a.text}</div>
          <div class="activity-time">${a.time}</div>
        </div>
      </div>
    `).join('');
  }

  document.getElementById('detailOverlay').classList.add('open');
}

function toggleCheck(taskId, i) {
  const t = tasks.find(x=>x.id===taskId);
  if (t) { t.checklist[i].done = !t.checklist[i].done; }
  openDetail(taskId); // re-render modal
  render();
}

/* ─── ADD MODAL ─── */
function openAddModal() {
  document.getElementById('addOverlay').classList.add('open');
}

function addTask() {
  const title = document.getElementById('f-title').value.trim();
  if (!title) { document.getElementById('f-title').focus(); return; }

  const tagsRaw = document.getElementById('f-tags').value;
  const tags = tagsRaw ? tagsRaw.split(',').map(s=>s.trim()).filter(Boolean) : [];
  const assignee = document.getElementById('f-assignee').value;

  const newId = 'ACM-' + (100 + tasks.length + 1);
  tasks.push({
    id: newId,
    title,
    status: document.getElementById('f-status').value,
    priority: document.getElementById('f-priority').value,
    pts: parseInt(document.getElementById('f-pts').value) || 3,
    due: 'May 11',
    assignees: [assignee],
    tags,
    desc: document.getElementById('f-desc').value.trim() || 'No description provided.',
    checklist: [],
    activity: [],
  });

  // reset
  ['f-title','f-desc','f-tags'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('f-pts').value = 3;

  closeModal('addOverlay');
  render();
  showToast('Task ' + newId + ' created!');
}

/* ─── MODAL HELPERS ─── */
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
function closeIfOverlay(e, id) { if (e.target === document.getElementById(id)) closeModal(id); }

/* ─── TOAST ─── */
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}

/* ─── KEYBOARD ─── */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    closeModal('detailOverlay');
    closeModal('addOverlay');
  }
});

/* ─── INIT ─── */
render();
</script>
