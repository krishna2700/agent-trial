<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SprintBoard — Acme Corp</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: #2e3248;
      --accent: #6366f1;
      --accent-hover: #4f52d4;
      --accent-light: rgba(99,102,241,0.12);
      --green: #22c55e;
      --green-light: rgba(34,197,94,0.12);
      --yellow: #f59e0b;
      --yellow-light: rgba(245,158,11,0.12);
      --red: #ef4444;
      --red-light: rgba(239,68,68,0.12);
      --blue: #38bdf8;
      --blue-light: rgba(56,189,248,0.12);
      --purple: #a855f7;
      --purple-light: rgba(168,85,247,0.12);
      --text: #e2e8f0;
      --text2: #94a3b8;
      --text3: #64748b;
      --radius: 12px;
      --shadow: 0 4px 24px rgba(0,0,0,0.4);
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── HEADER ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 32px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(12px);
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 1.2rem;
      letter-spacing: -0.5px;
    }
    .logo-icon {
      width: 34px;
      height: 34px;
      background: var(--accent);
      border-radius: 8px;
      display: grid;
      place-items: center;
      font-size: 1rem;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .sprint-badge {
      background: var(--accent-light);
      color: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 20px;
      padding: 4px 14px;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.3px;
    }
    .avatar-group { display: flex; align-items: center; }
    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 2px solid var(--surface);
      margin-left: -8px;
      font-size: 0.7rem;
      font-weight: 700;
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .avatar:first-child { margin-left: 0; }
    .avatar:hover { transform: translateY(-3px); z-index: 10; }

    /* ── SPRINT BANNER ── */
    .sprint-banner {
      background: linear-gradient(135deg, #1e1b4b 0%, #1a1d27 60%, #0f1117 100%);
      border-bottom: 1px solid var(--border);
      padding: 28px 32px;
    }
    .sprint-meta {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 20px;
    }
    .sprint-title-row h1 {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 4px;
    }
    .sprint-subtitle {
      color: var(--text2);
      font-size: 0.88rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .dot { width: 4px; height: 4px; border-radius: 50%; background: var(--text3); }
    .progress-panel {
      display: flex;
      gap: 32px;
      align-items: center;
    }
    .stat-box {
      text-align: center;
    }
    .stat-box .val {
      font-size: 1.6rem;
      font-weight: 800;
      line-height: 1;
    }
    .stat-box .lbl {
      font-size: 0.72rem;
      color: var(--text3);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-top: 3px;
    }
    .progress-bar-wrap {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 180px;
    }
    .progress-bar-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
      color: var(--text2);
    }
    .progress-bar {
      height: 8px;
      background: var(--border);
      border-radius: 99px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--purple));
      border-radius: 99px;
      transition: width 0.8s cubic-bezier(0.4,0,0.2,1);
    }

    /* ── CONTROLS ── */
    .controls {
      padding: 20px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      border-bottom: 1px solid var(--border);
    }
    .filter-tabs {
      display: flex;
      gap: 4px;
      background: var(--surface);
      border-radius: 10px;
      padding: 4px;
    }
    .filter-tab {
      padding: 6px 14px;
      border-radius: 7px;
      border: none;
      background: transparent;
      color: var(--text2);
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.18s;
      font-family: inherit;
    }
    .filter-tab.active, .filter-tab:hover {
      background: var(--accent);
      color: #fff;
    }
    .controls-right {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .search-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 14px;
      color: var(--text);
      font-size: 0.84rem;
      font-family: inherit;
      width: 220px;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-box:focus { border-color: var(--accent); }
    .search-box::placeholder { color: var(--text3); }
    .btn-add {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 7px 16px;
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.18s;
      font-family: inherit;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-add:hover { background: var(--accent-hover); transform: translateY(-1px); box-shadow: 0 4px 16px rgba(99,102,241,0.4); }

    /* ── BOARD ── */
    .board {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0;
      padding: 0;
      min-height: calc(100vh - 200px);
      border-top: none;
    }
    .column {
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }
    .column:last-child { border-right: none; }
    .col-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 64px;
      background: var(--bg);
      z-index: 10;
    }
    .col-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 0.88rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }
    .col-indicator {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }
    .col-count {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2px 10px;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text2);
    }
    .cards-list {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex: 1;
    }

    /* ── CARD ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 3px;
      height: 100%;
      border-radius: 3px 0 0 3px;
    }
    .card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: var(--shadow);
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 10px;
      gap: 8px;
    }
    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }
    .tag {
      font-size: 0.68rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 4px;
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }
    .card-priority {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .card-title {
      font-weight: 600;
      font-size: 0.9rem;
      line-height: 1.45;
      margin-bottom: 8px;
      color: var(--text);
    }
    .card-desc {
      font-size: 0.8rem;
      color: var(--text2);
      line-height: 1.5;
      margin-bottom: 12px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .card-meta {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .card-id {
      font-size: 0.72rem;
      color: var(--text3);
      font-weight: 500;
    }
    .card-points {
      font-size: 0.72rem;
      color: var(--text2);
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 6px;
      font-weight: 600;
    }
    .card-assignee {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      font-size: 0.65rem;
      font-weight: 700;
      display: grid;
      place-items: center;
      border: 2px solid var(--bg);
    }
    .card-due {
      font-size: 0.72rem;
      color: var(--text3);
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .card-due.overdue { color: var(--red); }
    .card-due.soon { color: var(--yellow); }
    .checkbox-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }
    .subtask-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      color: var(--text2);
    }
    .subtask-check {
      width: 13px;
      height: 13px;
      border-radius: 3px;
      border: 1.5px solid var(--border);
      background: transparent;
      cursor: pointer;
      accent-color: var(--accent);
      flex-shrink: 0;
    }
    .subtask-check:checked + span { text-decoration: line-through; color: var(--text3); }

    /* Priority colors */
    .priority-critical { color: var(--red); }
    .priority-high { color: var(--yellow); }
    .priority-medium { color: var(--blue); }
    .priority-low { color: var(--green); }

    /* Tag colors */
    .tag-frontend { background: var(--blue-light); color: var(--blue); }
    .tag-backend { background: var(--purple-light); color: var(--purple); }
    .tag-design { background: var(--accent-light); color: var(--accent); }
    .tag-qa { background: var(--green-light); color: var(--green); }
    .tag-devops { background: var(--yellow-light); color: var(--yellow); }
    .tag-bug { background: var(--red-light); color: var(--red); }

    /* Card accent borders */
    .card.p-critical::before { background: var(--red); }
    .card.p-high::before { background: var(--yellow); }
    .card.p-medium::before { background: var(--blue); }
    .card.p-low::before { background: var(--green); }

    /* Column colors */
    .col-todo .col-indicator { background: var(--text3); }
    .col-progress .col-indicator { background: var(--accent); }
    .col-review .col-indicator { background: var(--yellow); }
    .col-done .col-indicator { background: var(--green); }

    /* MODAL */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      width: 560px;
      max-width: 95vw;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 24px 80px rgba(0,0,0,0.6);
      animation: slideUp 0.22s cubic-bezier(0.4,0,0.2,1);
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .modal-header {
      padding: 20px 24px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }
    .modal-title { font-size: 1.1rem; font-weight: 700; line-height: 1.4; }
    .modal-close {
      background: none;
      border: none;
      color: var(--text3);
      font-size: 1.3rem;
      cursor: pointer;
      padding: 2px;
      line-height: 1;
      transition: color 0.18s;
      flex-shrink: 0;
    }
    .modal-close:hover { color: var(--text); }
    .modal-body { padding: 20px 24px; display: flex; flex-direction: column; gap: 18px; }
    .modal-row {
      display: flex;
      gap: 16px;
    }
    .modal-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }
    .modal-field label {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text2);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .modal-field-val {
      font-size: 0.88rem;
      color: var(--text);
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 8px 12px;
    }
    .modal-desc {
      font-size: 0.88rem;
      color: var(--text2);
      line-height: 1.6;
    }
    .modal-subtasks { display: flex; flex-direction: column; gap: 8px; }
    .modal-subtask {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.85rem;
      padding: 8px 12px;
      background: var(--surface2);
      border-radius: 7px;
      border: 1px solid var(--border);
    }
    .modal-subtask input[type="checkbox"] { accent-color: var(--accent); width: 15px; height: 15px; flex-shrink: 0; cursor: pointer; }
    .modal-subtask span { flex: 1; }
    .modal-subtask input:checked + span { text-decoration: line-through; color: var(--text3); }
    .modal-comments { display: flex; flex-direction: column; gap: 10px; }
    .comment {
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }
    .comment-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      font-size: 0.65rem;
      font-weight: 700;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }
    .comment-bubble {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      flex: 1;
    }
    .comment-author {
      font-size: 0.78rem;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .comment-text {
      font-size: 0.82rem;
      color: var(--text2);
      line-height: 1.5;
    }
    .comment-time {
      font-size: 0.7rem;
      color: var(--text3);
      margin-top: 4px;
    }

    /* SECTION LABEL */
    .modal-section-label {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text3);
      margin-bottom: -4px;
    }

    /* DONE column cards visual */
    .col-done .card { opacity: 0.75; }
    .col-done .card:hover { opacity: 1; }
    .card-done-check {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 20px;
      height: 20px;
      background: var(--green);
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 0.65rem;
      color: #fff;
    }

    /* RESPONSIVE */
    @media (max-width: 900px) {
      .board { grid-template-columns: repeat(2, 1fr); }
      .progress-panel { flex-wrap: wrap; }
    }
    @media (max-width: 580px) {
      .board { grid-template-columns: 1fr; }
      header { padding: 0 16px; }
      .sprint-banner, .controls { padding: 16px; }
      .cards-list { padding: 10px; }
    }
  </style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="logo">
    <div class="logo-icon">⚡</div>
    <span>Acme Corp <span style="color:var(--text3);font-weight:400;">/ SprintBoard</span></span>
  </div>
  <div class="header-right">
    <span class="sprint-badge">Sprint 14 — Active</span>
    <div class="avatar-group" id="team-avatars"></div>
  </div>
</header>

<!-- SPRINT BANNER -->
<div class="sprint-banner">
  <div class="sprint-meta">
    <div class="sprint-title-row">
      <h1>Q2 Platform Upgrade</h1>
      <div class="sprint-subtitle">
        <span>May 1 – May 14, 2026</span>
        <div class="dot"></div>
        <span>9 days remaining</span>
        <div class="dot"></div>
        <span id="sprint-team-count">6 engineers</span>
      </div>
    </div>
    <div class="progress-panel">
      <div class="stat-box">
        <div class="val" style="color:var(--green)" id="done-count">0</div>
        <div class="lbl">Done</div>
      </div>
      <div class="stat-box">
        <div class="val" style="color:var(--accent)" id="inprogress-count">0</div>
        <div class="lbl">In Progress</div>
      </div>
      <div class="stat-box">
        <div class="val" style="color:var(--text2)" id="todo-count">0</div>
        <div class="lbl">To Do</div>
      </div>
      <div class="stat-box">
        <div class="val" id="total-points">0</div>
        <div class="lbl">Story Points</div>
      </div>
      <div class="progress-bar-wrap">
        <div class="progress-bar-label">
          <span>Sprint Progress</span>
          <span id="progress-pct">0%</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" id="progress-fill" style="width:0%"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- CONTROLS -->
<div class="controls">
  <div class="filter-tabs">
    <button class="filter-tab active" data-filter="all" onclick="setFilter('all',this)">All</button>
    <button class="filter-tab" data-filter="frontend" onclick="setFilter('frontend',this)">Frontend</button>
    <button class="filter-tab" data-filter="backend" onclick="setFilter('backend',this)">Backend</button>
    <button class="filter-tab" data-filter="design" onclick="setFilter('design',this)">Design</button>
    <button class="filter-tab" data-filter="qa" onclick="setFilter('qa',this)">QA</button>
    <button class="filter-tab" data-filter="devops" onclick="setFilter('devops',this)">DevOps</button>
  </div>
  <div class="controls-right">
    <input class="search-box" type="text" placeholder="🔍  Search tasks…" oninput="searchTasks(this.value)" />
    <button class="btn-add" onclick="alert('Add Task feature — connect to your API!')">＋ Add Task</button>
  </div>
</div>

<!-- BOARD -->
<div class="board">
  <div class="column col-todo" id="col-todo">
    <div class="col-header">
      <div class="col-title"><div class="col-indicator"></div> To Do</div>
      <div class="col-count" id="cnt-todo">0</div>
    </div>
    <div class="cards-list" id="list-todo"></div>
  </div>
  <div class="column col-progress" id="col-progress">
    <div class="col-header">
      <div class="col-title"><div class="col-indicator"></div> In Progress</div>
      <div class="col-count" id="cnt-progress">0</div>
    </div>
    <div class="cards-list" id="list-progress"></div>
  </div>
  <div class="column col-review" id="col-review">
    <div class="col-header">
      <div class="col-title"><div class="col-indicator"></div> In Review</div>
      <div class="col-count" id="cnt-review">0</div>
    </div>
    <div class="cards-list" id="list-review"></div>
  </div>
  <div class="column col-done" id="col-done">
    <div class="col-header">
      <div class="col-title"><div class="col-indicator"></div> Done</div>
      <div class="col-count" id="cnt-done">0</div>
    </div>
    <div class="cards-list" id="list-done"></div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal" id="modal">
    <div class="modal-header">
      <div>
        <div id="m-id" style="font-size:0.75rem;color:var(--text3);margin-bottom:5px;"></div>
        <div class="modal-title" id="m-title"></div>
      </div>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>
    <div class="modal-body" id="m-body"></div>
  </div>
</div>

<script>
/* ─── DATA ─── */
const team = [

/* ─── STATE ─── */
let activeFilter = 'all';
let searchQuery = '';

/* ─── TEAM AVATARS ─── */
function renderTeam(){
  const el = document.getElementById('team-avatars');
  el.innerHTML = team.map(m=>`
    <div class="avatar" style="background:${m.bg};color:${m.color};" title="${m.name} — ${m.role}">${m.id}</div>
  `).join('');
}

/* ─── CARD RENDER ─── */
function priorityLabel(p){
  const map={critical:'⚠ Critical',high:'↑ High',medium:'→ Medium',low:'↓ Low'};
  return map[p]||p;
}
function buildCard(task){
  const m = teamById(task.assignee);
  const tagHtml = task.tags.map(t=>`<span class="tag tag-${t}">${t}</span>`).join('');
  const subDone = task.subtasks.filter(s=>s.done).length;
  const subTotal = task.subtasks.length;
  const dueDate = new Date(task.due);
  const now = new Date();
  const diffDays = Math.ceil((dueDate - now)/(1000*60*60*24));
  let dueClass = '';
  if(diffDays < 0) dueClass = 'overdue';
  else if(diffDays <= 2) dueClass = 'soon';
  const dueStr = dueDate.toLocaleDateString('en-US',{month:'short',day:'numeric'});
  const subtaskPreview = task.subtasks.slice(0,2).map(s=>`
    <div class="subtask-item">
      <input class="subtask-check" type="checkbox" ${s.done?'checked':''} onchange="toggleSubtask('${task.id}',${task.subtasks.indexOf(s)})" onclick="event.stopPropagation()"/>
      <span style="${s.done?'text-decoration:line-through;color:var(--text3)':''}">${s.text}</span>
    </div>`).join('');
  const doneCheck = task.status==='done'?'<div class="card-done-check">✓</div>':'';
  return `
  <div class="card p-${task.priority}" data-id="${task.id}" data-tags="${task.tags.join(',')}" onclick="openModal('${task.id}')">
    ${doneCheck}
    <div class="card-top">
      <div class="card-tags">${tagHtml}</div>
      <div class="card-priority priority-${task.priority}">${priorityLabel(task.priority)}</div>
    </div>
    <div class="card-title">${task.title}</div>
    <div class="card-desc">${task.desc}</div>
    ${subTotal>0?`<div class="checkbox-wrap">${subtaskPreview}</div>`:''}
    <div class="card-footer" style="margin-top:12px;">
      <div class="card-meta">
        <div class="card-id">${task.id}</div>
        <div class="card-points">${task.points} pts</div>
        ${task.comments.length>0?`<div class="card-id">💬 ${task.comments.length}</div>`:''}
        ${subTotal>0?`<div class="card-id">☑ ${subDone}/${subTotal}</div>`:''}
      </div>
      <div style="display:flex;align-items:center;gap:8px;">
        <div class="card-due ${dueClass}">${dueClass==='overdue'?'🔴':'📅'} ${dueStr}</div>
        <div class="card-assignee" style="background:${m.bg};color:${m.color};" title="${m.name}">${m.id}</div>
      </div>
    </div>
  </div>`;
}

/* ─── RENDER ALL ─── */
function render(){
  const cols = {todo:[],progress:[],review:[],done:[]};
  tasks.forEach(t=>{
    const tagMatch = activeFilter==='all' || t.tags.includes(activeFilter);
    const searchMatch = !searchQuery || t.title.toLowerCase().includes(searchQuery.toLowerCase()) || t.id.toLowerCase().includes(searchQuery.toLowerCase());
    if(tagMatch && searchMatch) cols[t.status].push(t);
  });

  document.getElementById('list-todo').innerHTML = cols.todo.map(buildCard).join('') || emptyState();
  document.getElementById('list-progress').innerHTML = cols.progress.map(buildCard).join('') || emptyState();
  document.getElementById('list-review').innerHTML = cols.review.map(buildCard).join('') || emptyState();
  document.getElementById('list-done').innerHTML = cols.done.map(buildCard).join('') || emptyState();

  document.getElementById('cnt-todo').textContent = cols.todo.length;
  document.getElementById('cnt-progress').textContent = cols.progress.length;
  document.getElementById('cnt-review').textContent = cols.review.length;
  document.getElementById('cnt-done').textContent = cols.done.length;

  updateStats();
}

function emptyState(){
  return `<div style="text-align:center;padding:32px 0;color:var(--text3);font-size:0.82rem;">No tasks</div>`;
}

/* ─── STATS ─── */
function updateStats(){
  const done = tasks.filter(t=>t.status==='done').length;
  const inprogress = tasks.filter(t=>t.status==='progress').length;
  const todo = tasks.filter(t=>t.status==='todo').length;
  const total = tasks.length;
  const totalPts = tasks.reduce((a,t)=>a+t.points,0);
  const pct = Math.round((done/total)*100);

  document.getElementById('done-count').textContent = done;
  document.getElementById('inprogress-count').textContent = inprogress;
  document.getElementById('todo-count').textContent = todo;
  document.getElementById('total-points').textContent = totalPts;
  document.getElementById('progress-pct').textContent = pct+'%';
  setTimeout(()=>{ document.getElementById('progress-fill').style.width = pct+'%'; },100);
}

/* ─── FILTER / SEARCH ─── */
function setFilter(f, btn){
  activeFilter = f;
  document.querySelectorAll('.filter-tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  render();
}
function searchTasks(q){ searchQuery = q; render(); }

/* ─── SUBTASK TOGGLE ─── */
function toggleSubtask(taskId, idx){
  const t = tasks.find(t=>t.id===taskId);
  if(t) t.subtasks[idx].done = !t.subtasks[idx].done;
  // Don't re-render to preserve UX (checkbox already visually toggled)
}

/* ─── MODAL ─── */
function openModal(id){
  const t = tasks.find(x=>x.id===id);
  if(!t) return;
  const m = teamById(t.assignee);
  document.getElementById('m-id').textContent = t.id + ' · ' + t.tags.join(', ') + ' · ' + t.points + ' story points';
  document.getElementById('m-title').textContent = t.title;

  const dueDate = new Date(t.due);
  const dueStr = dueDate.toLocaleDateString('en-US',{weekday:'short',month:'long',day:'numeric',year:'numeric'});
  const statusLabels = {todo:'To Do',progress:'In Progress',review:'In Review',done:'Done'};

  const subtasksHtml = t.subtasks.map((s,i)=>`
    <div class="modal-subtask">
      <input type="checkbox" ${s.done?'checked':''} onchange="toggleSubtaskModal('${t.id}',${i},this)"/>
      <span style="${s.done?'text-decoration:line-through;color:var(--text3)':''}">${s.text}</span>
    </div>`).join('');

  const commentsHtml = t.comments.map(c=>{
    const cm = teamById(c.author);
    return `<div class="comment">
      <div class="comment-avatar" style="background:${cm.bg};color:${cm.color};">${cm.id}</div>
      <div class="comment-bubble">
        <div class="comment-author" style="color:${cm.color};">${cm.name}</div>
        <div class="comment-text">${c.text}</div>
        <div class="comment-time">${c.time}</div>
      </div>
    </div>`;
  }).join('') || '<div style="color:var(--text3);font-size:0.82rem;">No comments yet.</div>';

  document.getElementById('m-body').innerHTML = `
    <div class="modal-row">
      <div class="modal-field"><label>Status</label><div class="modal-field-val">${statusLabels[t.status]}</div></div>
      <div class="modal-field"><label>Priority</label><div class="modal-field-val priority-${t.priority}">${priorityLabel(t.priority)}</div></div>
      <div class="modal-field"><label>Due</label><div class="modal-field-val">${dueStr}</div></div>
    </div>
    <div class="modal-row">
      <div class="modal-field"><label>Assignee</label>
        <div class="modal-field-val" style="display:flex;align-items:center;gap:8px;">
          <div style="width:22px;height:22px;border-radius:50%;background:${m.bg};color:${m.color};font-size:0.65rem;font-weight:700;display:grid;place-items:center;">${m.id}</div>
          ${m.name} <span style="color:var(--text3);font-size:0.78rem;">— ${m.role}</span>
        </div>
      </div>
    </div>
    <div class="modal-field">
      <label>Description</label>
      <div class="modal-desc">${t.desc}</div>
    </div>
    ${t.subtasks.length>0?`
      <div class="modal-field">
        <div class="modal-section-label">Subtasks (${t.subtasks.filter(s=>s.done).length}/${t.subtasks.length})</div>
        <div class="modal-subtasks">${subtasksHtml}</div>
      </div>`:''}
    <div class="modal-field">
      <div class="modal-section-label">Comments (${t.comments.length})</div>
      <div class="modal-comments">${commentsHtml}</div>
    </div>
  `;

  document.getElementById('modal-overlay').classList.add('open');
}

function toggleSubtaskModal(taskId, idx, el){
  const t = tasks.find(x=>x.id===taskId);
  if(t){ t.subtasks[idx].done = el.checked; }
  const span = el.nextElementSibling;
  if(span){ span.style.textDecoration = el.checked?'line-through':''; span.style.color = el.checked?'var(--text3)':''; }
}

function closeModal(e){
  if(!e || e.target===document.getElementById('modal-overlay')){
    document.getElementById('modal-overlay').classList.remove('open');
  }
}

document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });

/* ─── INIT ─── */
renderTeam();
render();
</script>
